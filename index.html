<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한글 놀이">
<title>한글 놀이</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E5; --ink:#4A3B2A; --soft:#9A8670; --line:#EFDFC6; --card:#fff;
  --c:#3B82F6; --c3:#DCEBFF; --v:#EF5350; --v3:#FFE0DE; --t:#17A35B; --t3:#D9F5E4; --ok:#2EBD6B; --ok3:#E4F8EC;
  --dav:#FFC83D; --dav2:#E9A400; --dav3:#FFF0BF;
  --ari:#F49AC1; --ari2:#C774E8; --ari3:#FCE3F0;
  --kid:var(--dav); --kid2:var(--dav2); --kid3:var(--dav3);
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
body.arin{--kid:var(--ari); --kid2:var(--ari2); --kid3:var(--ari3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{background:radial-gradient(circle at 15% 10%,#fff 0,transparent 40%),var(--bg)}
body.davin,body.arin{background:radial-gradient(circle at 85% 0%,var(--kid3) 0,transparent 55%),var(--bg)}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;font-size:inherit}
.hidden{display:none!important}
.press{transition:transform .08s}
.press:active{transform:translateY(4px) scale(.98)}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:14px 20px 4px;flex:none}
.back{width:66px;height:66px;border-radius:22px;background:#fff;box-shadow:0 5px 0 var(--line);font-size:34px;display:grid;place-items:center;flex:none}
.top h1{margin:0;font-weight:400;font-size:34px;flex:1;display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:hidden}
.top h1 img{width:52px;height:52px;border-radius:50%;border:4px solid var(--kid)}
.stars{background:#fff;border-radius:999px;padding:8px 20px 8px 14px;font-size:30px;box-shadow:0 5px 0 var(--line);display:flex;align-items:center;gap:6px;flex:none}
.stars b{font-weight:400;min-width:1.2em;text-align:center;display:inline-block}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.4)}}
.main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;padding:8px 20px 20px;gap:14px}

/* tabs */
.tabs{display:flex;gap:10px;flex:none;flex-wrap:wrap;justify-content:center}
.tabs button{background:#fff;border-radius:999px;padding:12px 24px;font-size:26px;box-shadow:0 4px 0 var(--line);opacity:.7}
.tabs button.on,.levels button.on{background:var(--kid);opacity:1;box-shadow:0 4px 0 var(--kid2)}

/* home */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;position:relative;padding:20px}
.logo{display:flex;gap:1.2vmin}
.logo span{font-size:min(12vmin,96px);width:1.3em;height:1.3em;display:grid;place-items:center;border-radius:28%;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12);animation:hop 2.4s ease-in-out infinite}
.logo span:nth-child(1){background:#FF8A65}.logo span:nth-child(2){background:#FFC83D;animation-delay:.15s}
.logo span:nth-child(3){background:transparent;box-shadow:none;width:.4em}
.logo span:nth-child(4){background:#4FC3A1;animation-delay:.3s}.logo span:nth-child(5){background:#7C9CFF;animation-delay:.45s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-14px) rotate(-4deg)}}
.kids{display:flex;gap:5vmin;flex-wrap:wrap;justify-content:center}
.kidcard{width:min(40vmin,330px);border-radius:40px;padding:26px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 10px 0 rgba(0,0,0,.08)}
.kidcard.davin{background:var(--dav3);border:6px solid var(--dav)}
.kidcard.arin{background:var(--ari3);border:6px solid var(--ari)}
.kidcard img{width:72%;aspect-ratio:1;border-radius:50%;background:#fff;border:6px solid #fff}
.kidcard .nm{font-size:min(7vmin,52px)}
.kidcard .st{font-size:min(4.4vmin,30px);background:#fff;border-radius:999px;padding:4px 16px}
.gear{position:absolute;right:22px;bottom:22px;width:62px;height:62px;border-radius:50%;background:#fff;font-size:30px;box-shadow:0 4px 0 var(--line);opacity:.8}

/* menu */
.acts{flex:1;width:100%;max-width:1100px;display:grid;gap:22px;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;min-height:0}
.acts.n4{grid-template-columns:repeat(2,1fr);max-width:860px}
.act{border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 0 rgba(0,0,0,.09);min-height:0;position:relative;overflow:hidden}
.act .ic{font-size:min(13vmin,104px);line-height:1;padding:4px 0}
.act .tx{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.act .lb,.act .ex{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.act .lb{font-size:min(4.6vmin,36px)}
.act .ex{font-size:min(3.2vmin,24px);opacity:.75}
.shelf{flex:none;display:flex;gap:6px;align-items:center;background:#fff;border-radius:999px;padding:8px 20px;box-shadow:0 4px 0 var(--line);font-size:30px;max-width:100%;overflow-x:auto}
.shelf small{font-size:20px;color:var(--soft);margin-right:6px;white-space:nowrap}
@media (orientation:portrait){.acts{grid-template-columns:repeat(2,1fr)}}

/* letter tiles */
.lgrid{flex:1;width:100%;max-width:1100px;display:grid;gap:16px;grid-template-columns:repeat(7,1fr);align-content:center;min-height:0}
.lgrid.v{grid-template-columns:repeat(5,1fr)}
@media (orientation:portrait){.lgrid{grid-template-columns:repeat(4,1fr)}.lgrid.v{grid-template-columns:repeat(4,1fr)}}
.lt{background:#fff;border-radius:26px;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 var(--line);position:relative;max-height:22vh;justify-self:center;width:100%}
.lt .g{font-size:min(8.5vmin,70px);line-height:1}
.lt.c .g{color:var(--c)}.lt.v .g{color:var(--v)}
.lt .e{font-size:min(4.2vmin,34px)}
.lt .mk,.wt .mk{position:absolute;top:6px;right:8px;font-size:20px}

/* overlay card */
.ov{position:fixed;inset:0;background:rgba(74,59,42,.35);display:grid;place-items:center;z-index:30;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.bigcard{background:#fff;border-radius:44px;padding:26px 30px 24px;width:min(92vw,620px);display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;box-shadow:0 14px 0 rgba(0,0,0,.1);animation:popin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.bigcard .x{position:absolute;right:16px;top:16px;width:58px;height:58px;border-radius:50%;background:#F4ECE0;font-size:26px}
.bigcard .bl{font-size:min(26vmin,190px);line-height:1.05}
.bigcard.c .bl{color:var(--c)}.bigcard.v .bl{color:var(--v)}
.bigcard .pic{font-size:min(16vmin,120px);line-height:1.1}
.bigcard .word{font-size:min(9vmin,64px);letter-spacing:.06em}
.bigcard.c .word b{color:var(--c);font-weight:400}.bigcard.v .word b{color:var(--v);font-weight:400}
.bigcard .row{display:flex;gap:12px;margin-top:10px;align-items:center}
.rb{min-width:74px;height:74px;border-radius:24px;background:var(--kid3);font-size:34px;padding:0 16px;box-shadow:0 5px 0 var(--line)}
.rb.go{background:var(--kid);box-shadow:0 5px 0 var(--kid2)}
.boing{animation:boing .5s}
@keyframes boing{30%{transform:scale(1.18,.86)}60%{transform:scale(.92,1.1)}}

/* trace */
.trace{flex:1;min-height:0;width:100%;display:flex;gap:22px;align-items:stretch;justify-content:center}
.tbox{flex:1;min-width:0;min-height:0;display:grid;place-items:center;max-width:820px}
.tcv{touch-action:none;border-radius:8%;box-shadow:0 8px 0 var(--line);display:block}
.side{display:flex;flex-direction:column;gap:14px;justify-content:center;flex:none}
.side .rb{width:96px;height:86px;font-size:40px}
@media (orientation:portrait){.trace{flex-direction:column;align-items:center}.tbox{width:100%;max-width:none}.side{flex-direction:row}}
.wordhead{display:flex;align-items:center;gap:18px;font-size:min(8vmin,56px);flex:none}
.wordhead .pe{font-size:1.2em}
.wordhead span{padding:0 6px;border-radius:14px;color:#C9BBA8}
.wordhead span.cur{background:var(--kid3);color:var(--ink)}
.wordhead span.dn{color:var(--ink)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
.wgrid{flex:1;width:100%;max-width:1100px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));align-content:start;overflow-y:auto;padding:4px 4px 20px;min-height:0;-webkit-overflow-scrolling:touch}
.wt{background:#fff;border-radius:24px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;box-shadow:0 5px 0 var(--line);position:relative}
.wt .e{font-size:52px;line-height:1.15}.wt .w{font-size:30px}

/* blocks */
.eq{display:flex;align-items:center;gap:16px;flex:none}
.slot{width:min(21vmin,175px);height:min(21vmin,175px);border-radius:30px;background:#fff;border:5px dashed var(--line);display:grid;place-items:center;font-size:min(14vmin,110px);line-height:1}
.slot.cs{color:var(--c)}.slot.vs{color:var(--v)}
.slot.full{border-style:solid}.slot.cs.full{border-color:var(--c3)}.slot.vs.full{border-color:var(--v3)}
.slot.res{width:min(27vmin,225px);height:min(27vmin,225px);border-color:var(--kid);border-style:solid;font-size:min(16vmin,120px);color:#D8CCBC}
.slot svg{width:90%;height:90%}
.op{font-size:min(8vmin,60px);color:var(--soft)}
.pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1140px;flex:none}
.pal button{width:min(9vmin,72px,calc((100vw - 150px) / 14));height:min(9vmin,74px,calc((100vw - 150px) / 14));border-radius:20px;background:#fff;font-size:min(6.4vmin,50px);box-shadow:0 5px 0 var(--line)}
@media (orientation:portrait){.pal button{width:min(10.5vmin,86px);height:min(10.5vmin,86px)}}
.pal.cp button{color:var(--c)}.pal.vp button{color:var(--v)}
.pal button.on{background:var(--kid3);box-shadow:0 5px 0 var(--kid)}
.bonus{height:min(10vmin,80px);font-size:min(9vmin,70px);display:flex;align-items:center;gap:10px;flex:none}
.bonus small{font-size:min(5vmin,40px)}
.tgt{background:var(--kid);box-shadow:0 5px 0 var(--kid2);border-radius:999px;padding:10px 28px;font-size:30px}
.pop{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}

/* puzzle */
.pz{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;gap:10px}
.pzpic{font-size:min(22vmin,170px);line-height:1.1;background:#fff;border-radius:44px;padding:4px 36px;box-shadow:0 8px 0 var(--line);position:relative}
.pzpic::after,.charpic::after{content:"🔊";position:absolute;right:-10px;bottom:-6px;font-size:32px;background:var(--kid);border-radius:50%;width:56px;height:56px;display:grid;place-items:center}
.slots{display:flex;gap:14px}
.pslot{width:min(17vmin,132px);height:min(17vmin,132px);border-radius:28px;border:5px dashed #D9C8B0;background:rgba(255,255,255,.6);display:grid;place-items:center;font-size:min(12vmin,92px)}
.pslot.full{border-style:solid;border-color:var(--kid);background:#fff}
.pslot.good{border-color:var(--ok);background:var(--ok3);color:#178a49}
.tiles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.tile{width:min(15vmin,118px);height:min(15vmin,118px);border-radius:26px;background:var(--kid3);font-size:min(10.5vmin,80px);box-shadow:0 6px 0 var(--kid)}
.tile.used{visibility:hidden}
.nextbtn{background:var(--ok);color:#fff;border-radius:999px;font-size:44px;padding:10px 46px;box-shadow:0 6px 0 #1f9a55;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* reading */
.rq{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly}
.rword{display:flex;gap:8px;background:#fff;border-radius:40px;padding:10px 34px;box-shadow:0 8px 0 var(--line)}
.rword button{font-size:min(17vmin,130px);line-height:1.15;padding:0 6px;border-radius:24px}
.rword button.lit{background:var(--kid3)}
.hint{font-size:22px;color:var(--soft)}
.choices{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.ch{width:min(22vmin,180px);height:min(22vmin,180px);border-radius:36px;background:#fff;font-size:min(14vmin,110px);box-shadow:0 7px 0 var(--line);transition:opacity .3s}
.ch.no{opacity:.25;pointer-events:none}
.ch.good{background:var(--ok3);box-shadow:0 7px 0 var(--ok)}

/* balloons */
.sky{flex:1;width:100%;position:relative;overflow:hidden;border-radius:36px;background:linear-gradient(#BFE6FF,#E9F7FF 70%,#F3FFF0);min-height:0}
.sky .cloud{position:absolute;font-size:80px;opacity:.9;animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(110vw)}}
.bal{position:absolute;left:0;top:0;width:150px;height:230px;margin-left:-75px;will-change:transform;touch-action:none}
.bal .sw{width:100%;height:100%;animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.bal svg{width:100%;height:100%;overflow:visible}
.bal .lt2{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:84px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.15);pointer-events:none}
.bal.popd{animation:popd .3s forwards}
@keyframes popd{to{opacity:0;scale:1.6}}
.bal.wob .sw{animation:wob .45s}
@keyframes wob{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.say{position:absolute;left:16px;bottom:16px;background:#fff;border-radius:999px;padding:10px 24px 10px 16px;font-size:56px;box-shadow:0 6px 0 rgba(0,0,0,.1);display:flex;align-items:center;gap:8px;z-index:3}
.levels{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:none}
.levels button{background:#fff;border-radius:18px;padding:8px 14px;font-size:24px;box-shadow:0 4px 0 var(--line);opacity:.7}
.burst{position:absolute;pointer-events:none;font-size:34px;animation:burst .7s ease-out forwards;z-index:4}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}

/* fx */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-60px;font-style:normal;animation:fall 2.3s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(600deg)}}
.flystar{position:fixed;z-index:70;font-size:54px;pointer-events:none}
.sticker{font-size:min(40vmin,260px);animation:spin 1.2s cubic-bezier(.3,1.5,.5,1)}
@keyframes spin{from{transform:scale(0) rotate(-200deg)}}

/* 오늘의 한글 */
.daily-banner{flex:none;width:100%;max-width:1100px;display:flex;align-items:center;gap:18px;background:#fff;border:5px solid var(--kid);border-radius:32px;padding:10px 26px;box-shadow:0 6px 0 var(--kid2)}
.daily-banner .db-ic{font-size:54px}
.daily-banner .db-t{flex:1;text-align:left}
.daily-banner .db-t b{display:block;font-weight:400;font-size:36px}
.daily-banner .db-t small{font-size:22px;color:var(--soft)}
.daily-banner .db-dots{font-size:40px;letter-spacing:4px}
.daily-banner .db-o{opacity:.3;filter:grayscale(1)}
.daily-banner.done{border-color:var(--ok);box-shadow:0 6px 0 #1f9a55}
.pill{background:var(--kid);border-radius:999px;padding:8px 18px;font-size:28px;box-shadow:0 5px 0 var(--kid2);flex:none}
.pill b{font-weight:400;display:inline-block}
.dmain{justify-content:space-evenly}
.dhero{display:flex;align-items:center;gap:26px;background:#fff;border-radius:40px;padding:14px 36px;box-shadow:0 8px 0 var(--line);flex:none}
.dhero .big{font-size:min(19vmin,150px);line-height:1.05;color:var(--c)}
.dhero .big.v{color:var(--v)}
.dhero .em{font-size:min(13vmin,100px)}
.dhero .row5{display:flex;gap:10px}
.dhero .row5 button{font-size:min(9vmin,70px);background:var(--kid3);border-radius:22px;padding:2px 16px;box-shadow:0 4px 0 var(--kid)}
.dtasks{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;flex:none}
.dtask{width:min(23vmin,190px);border-radius:32px;background:#fff;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 var(--line);position:relative;border:5px solid transparent}
.dtask .ic{font-size:min(9vmin,70px);line-height:1.1}
.dtask .lb{font-size:min(3.3vmin,26px);white-space:nowrap}
.dtask .pg{font-size:22px;letter-spacing:3px;color:var(--kid2)}
.dtask.next{border-color:var(--kid);box-shadow:0 7px 0 var(--kid2);animation:pulse 1.4s infinite}
.dtask.ok{background:var(--ok3);box-shadow:0 7px 0 var(--ok)}
.dtask.ok .pg{color:var(--ok)}
.dtask.ok::after{content:"✅";position:absolute;top:-14px;right:-10px;font-size:42px}
.week{display:flex;gap:10px;flex:none}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:22px;color:var(--soft)}
.week span{width:min(8vmin,62px);height:min(8vmin,62px);border-radius:50%;background:#fff;box-shadow:0 4px 0 var(--line);display:grid;place-items:center;font-size:min(5vmin,38px);border:4px solid transparent}
.week .today span{border-color:var(--kid)}
.week .today{color:var(--ink)}
.gobig{background:var(--ok);color:#fff;border-radius:999px;font-size:46px;padding:12px 60px;box-shadow:0 7px 0 #1f9a55;flex:none}
.gobig.fin{background:#fff;color:var(--ink);box-shadow:0 7px 0 var(--line);font-size:36px}

.dhero .big.jong{font-size:min(7vmin,52px);color:var(--ink);display:flex;flex-direction:column;align-items:center;line-height:1}
.dhero .big.jong span{font-size:min(15vmin,120px);color:var(--t)}
.dhero .row5 button.gl{width:min(15vmin,120px);height:min(15vmin,120px);padding:8px}
.dhero .row5 button.gl svg{width:100%;height:100%}
.tmr{font-size:24px;color:var(--soft);flex:none}
.tmr b{font-weight:400;color:var(--ink)}

/* 복습 퀴즈 */
.qtop{display:flex;flex-direction:column;align-items:center;gap:10px}
.qbig{font-size:min(20vmin,150px);line-height:1.1;background:#fff;border-radius:44px;padding:6px 44px;box-shadow:0 8px 0 var(--line);min-width:min(30vmin,240px)}
.ch.w{width:auto;min-width:min(22vmin,180px);padding:0 26px;font-size:min(9vmin,70px)}

/* 받침 칸, 글자 많은 판 */
.slot.ts{color:var(--t);font-size:min(6vmin,40px)}
.slot.ts:not(.full){opacity:.7}
.slot.ts.full{border-color:var(--t3);font-size:min(14vmin,110px)}
.slot.ts.ask{border-color:var(--t);animation:pulse 1.2s infinite}
.jm .slot{width:min(17vmin,140px);height:min(17vmin,140px);font-size:min(12vmin,96px)}
.jm .slot.res{width:min(21vmin,175px);height:min(21vmin,175px)}
.jm .slot.ts:not(.full){font-size:min(5vmin,34px)}
.jm .pal button{width:min(7.6vmin,62px);height:min(7.6vmin,62px);font-size:min(5.4vmin,42px);border-radius:16px}
.jm .bonus{height:min(8vmin,60px)}

.coinline{font-size:44px;background:#FFF4C7;border-radius:999px;padding:4px 26px;box-shadow:0 4px 0 #F2C94C;animation:popin .5s 1.4s both cubic-bezier(.3,1.6,.5,1)}
.coinline small{font-size:24px;color:var(--soft)}

  for (const s of strokes) for (const [x, y] of (s.o ? [[s.o[0] - s.o[2], s.o[1] - s.o[2]], [s.o[0] + s.o[2], s.o[1] + s.o[2]]] : s)) {

}

  return strokes.map(s => s.o ? circlePts(mx(s.o[0]), my(s.o[1]), s.o[2] * r) : s.map(([x, y]) => [mx(x), my(y)]));

// 쌍자음 = 같은 자음 두 개를 나란히

    if (V_LEFT.includes(v)) return { C: [8, wide ? 33 : 40, 20, 80], V: wide ? [46, 90, 8, 92] : [52, 84, 8, 92] };
    if (V_DOWN.includes(v)) return { C: [24, 76, 8, 46], V: [8, 92, 58, 80] };
    if (V_UP.includes(v)) return { C: [24, 76, 8, 44], V: [8, 92, 56, 90] };
    if (v === 'ㅡ') return { C: [24, 76, 10, 54], V: [8, 92, 70, 70] };
    return { C: [10, v === 'ㅝ' ? 44 : 52, 8, 44], V: [6, 92, 8, 92] };          // ㅘ ㅚ ㅝ ㅟ ㅢ
  }
  const T = [22, 78, 70, 92];

const ARIN_SEQ = 'ㄱ ㄴ ㅏ + ㄷ ㅓ + ㄹ ㅗ + ㅁ ㅜ + ㅂ ㅡ + ㅅ ㅣ + ㅇ ㅈ + ㅊ ㅑ + ㅋ ㅕ + ㅌ ㅛ + ㅍ ㅠ + ㅎ +'.split(' ');
const ARIN_LETTERS = ARIN_SEQ.filter(t => t !== '+');   // 아린이가 배우는 순서대로 글자 24개
const FREQ = '나가고기이자차코소비파표하호도두무오우아어거너더모마바사지구누부수주치피키토티후히요유야여교라로리러루드그느스츠크트프흐';
const ARIN_LESSONS = (() => {
  const out = [], kc = [], kv = []; let fresh = [];
  for (const tok of ARIN_SEQ) {
    if (tok !== '+') { out.push({ kind: 'letter', title: tok, hero: tok, jamo: [tok], syl: [], words: [] }); (isCons(tok) ? kc : kv).push(tok); fresh.push(tok); continue; }
    const cands = []; kc.forEach(c => kv.forEach(v => { if (fresh.includes(c) || fresh.includes(v)) cands.push(compose(c, v)); }));
    // 자주 쓰는 글자부터, 새로 배운 글자마다 하나는 꼭 들어가게
    const rank = s => (ONE[s] ? -100 : 0) + (FREQ.indexOf(s) < 0 ? 99 : FREQ.indexOf(s));
    cands.sort((a, b) => rank(a) - rank(b));

// 조각을 누르면 빈칸에, 빈칸을 누르면 빼기. 다 차면 확인 → 맞으면 onRight(한 번이라도 틀렸는지)
function tilePuzzle(box, syl, tilesData, ghost, word, onRight) {
  const slots = $$('.pslot', box), tiles = $$('.tile', box), filled = syl.map(() => null);
  let locked = false, wrong = false, ck = 0;
  const clearSlot = i => { slots[i].innerHTML = ghost ? `<i class="ghost">${syl[i]}</i>` : ''; slots[i].classList.remove('full'); filled[i] = null; };
  tiles.forEach(t => t.onclick = () => {
    if (locked || t.classList.contains('used')) return;
    const at = filled.indexOf(null); if (at < 0) return;
    filled[at] = +t.dataset.i; t.classList.add('used');
    slots[at].textContent = t.textContent; slots[at].classList.add('full'); bounce(slots[at], 'pop'); say(t.textContent);
    if (!filled.includes(null)) { clearTimeout(ck); ck = setTimeout(check, 500); }
  });
  slots.forEach((sl, i) => sl.onclick = () => { if (locked || filled[i] === null) return; tiles[filled[i]].classList.remove('used'); clearSlot(i); });
  function check() {
    if (locked || filled.includes(null) || !box.isConnected) return;
    if (filled.map(i => tilesData[i]).join('') === word) { locked = true; slots.forEach(s => s.classList.add('good')); onRight(wrong); return; }
    SFX.no();
    filled.forEach((ti, i) => { if (tilesData[ti] !== syl[i]) { bounce(slots[i], 'shake'); setTimeout(() => { tiles[ti].classList.remove('used'); clearSlot(i); }, 550); } });
    wrong = true; thinkLock($('.tiles', box), [word]);
  }
}
function levelPool(done, forRead) {
  const n = Object.keys(done).length;
  const max = n < 8 ? 2 : n < 20 ? 3 : 4, min = forRead ? 1 : 2;
  const pool = knownWords().filter(x => x.n >= min && x.n <= max && x.w !== lastWord);
  const fresh = pool.filter(x => !done[x.w]);
  return fresh.length ? fresh : pool;
}
function puzzle() {
  topbar('🧩 낱말 퍼즐', () => go(menu));
  const k = K(), x = isDM('puzzle') ? dmWord(2, 3) : rnd(levelPool(k.solved)); lastWord = x.w;
  const syl = [...x.w], solvedN = Object.keys(k.solved).length;
  const extraN = solvedN < 5 ? 1 : solvedN < 15 ? 2 : 3;
  const others = shuffle([...new Set(knownWords().flatMap(y => [...y.w]))].filter(s => !syl.includes(s))).slice(0, extraN);
  const tilesData = shuffle([...syl, ...others]);
  const m = mainEl(puzzleHTML(`<button class="pzpic press">${x.e}</button>`, syl, tilesData));
  const pic = $('.pzpic', m);
  pic.onclick = () => { bounce(pic); say(x.w); };
  tilePuzzle(m, syl, tilesData, false, x.w, wrong => {
    SFX.tada(); confetti(); say(x.w);
    k.solved[x.w] = 1; save();
    if (!wrong) { addStar($('.slots', m)); report('puzzle'); } else oops();
    showNext(m, () => go(puzzle));
  });
  later(pic, () => { bounce(pic); say(x.w); }, 300);
}

/* ───────── 📖 읽고 찾기: 글자를 읽고 맞는 그림 고르기 ───────── */
function readQuiz() {
  topbar('📖 읽고 찾기', () => go(menu));
  const k = K(), x = isDM('read') ? dmWord(1, 3) : rnd(levelPool(k.read, true)); lastWord = x.w;
  const n = Object.keys(k.read).length < 6 ? 3 : 4;
  const opts = shuffle([x, ...shuffle(knownWords().filter(y => y.w !== x.w && y.e !== x.e)).slice(0, n - 1)]);
  const m = mainEl(`<div class="rq">
    <div class="rword">${[...x.w].map(s => `<button>${s}</button>`).join('')}</div>
    <div class="hint">글자를 누르면 소리가 나요 · 다 읽었으면 그림을 골라요</div>
    <div class="choices">${opts.map((o, i) => `<button class="ch press" data-i="${i}">${o.e}</button>`).join('')}</div>
    <button class="nextbtn hidden">다음 ▶</button></div>`);
  const litAll = rwordTaps(m), bs = $$('.ch', m);

  bs.forEach(b => b.onclick = () => {
    if (over) return;

      SFX.tada(); confetti(); say(x.w);

      showNext(m, () => go(readQuiz));

      SFX.no(); bounce(b, 'shake'); b.classList.add('no'); say(o.w);
      wrong = true; thinkLock($('.choices', m));
    }
  });
}

/* ───────── 🎈 풍선 놀이: 소리 듣고 글자 풍선 터뜨리기 ───────── */
const BCOL = ['#FF6B6B', '#FFA94D', '#FFC83D', '#51CF66', '#4DABF7', '#9775FA', '#F783AC', '#20C997'];
function balloonSVG(col) {
  return `<svg viewBox="0 0 150 230"><path d="M75 182 C70 196 82 206 74 230" stroke="#A39888" stroke-width="2.5" fill="none"/>
  <path d="M75 6 C118 6 142 42 142 84 C142 130 108 170 75 178 C42 170 8 130 8 84 C8 42 32 6 75 6Z" fill="${col}"/>
  <path d="M68 176 L82 176 L78 186 L72 186Z" fill="${col}"/>
  <ellipse cx="46" cy="52" rx="12" ry="22" fill="#fff" opacity=".35" transform="rotate(25 46 52)"/></svg>`;
}
function balloons() {
  topbar('🎈 풍선 놀이', () => go(menu));
  const k = K();
  const m = mainEl();
  const lv = h('<div class="levels"></div>');
  GROUPS.forEach((g, i) => { const b = h(`<button class="press ${i === k.bal ? 'on' : ''}">${g.t}</button>`); b.onclick = () => { k.bal = i; save(); go(balloons); }; lv.append(b); });
  const sky = h(`<div class="sky"><div class="cloud" style="top:8%;animation-delay:-8s">☁️</div><div class="cloud" style="top:30%;animation-delay:-25s;font-size:60px">☁️</div>
    <button class="say press">🔊 <span></span></button></div>`);
  const dm = isDM('balloon');
  if (dm) lv.classList.add('hidden');
  m.append(lv, sky);
  const group = dm ? reviewSet() : GROUPS[k.bal].js;
  let target = null, bl = [], raf = 0, last = 0, lock = false, prevT = '', missed = false;
  const speed = () => sky.clientHeight / (kid === 'arin' ? 9 : 6.5);
  function announce() { const x = info(target); $('.say span', sky).textContent = x.e; say(phon(target), 350, x.w); }
  $('.say', sky).onclick = announce;
  function round() {
    bl.forEach(b => b.el.remove()); bl = []; lock = false; missed = false;
    if (dm) { const f = group.includes(DM.letter) ? DM.letter : null; do target = f && Math.random() < .45 ? f : rnd(group); while (target === prevT && group.length > 1); }
    else { do target = rnd(group); while (target === prevT && group.length > 1); }
    prevT = target;
    const pool = group.length >= 3 ? group : dm ? [...new Set([...group, ...ARIN_LETTERS.slice(0, 6)])] : [...CJ, ...VJ];
    const n = kid === 'arin' ? 3 : 4;
    const letters = shuffle([target, ...shuffle(pool.filter(j => j !== target)).slice(0, n - 1)]);
    const W = sky.clientWidth, H = sky.clientHeight, cols = shuffle(BCOL);
    letters.forEach((j, i) => {
      const el = h(`<div class="bal"><div class="sw" style="animation-delay:${-Math.random() * 3}s">${balloonSVG(cols[i])}<div class="lt2">${j}</div></div></div>`);
      const b = { el, j, x: W * (i + .5) / n + (Math.random() - .5) * W * .06, y: H * .45 + Math.random() * H * .35 };
      el.addEventListener('pointerdown', e => { e.preventDefault(); hit(b); });
      sky.append(el); bl.push(b);
    });
    announce();
  }
  function hit(b) {
    if (lock || b.gone) return;
    if (b.j === target) {
      lock = true; b.gone = true; SFX.pop(); setTimeout(SFX.ok, 120);
      b.el.classList.add('popd');
      const r = b.el.getBoundingClientRect(), sr = sky.getBoundingClientRect();
      for (let i = 0; i < 10; i++) {
        const p = h(`<div class="burst">${rnd(['✨', '⭐', '🎉', '💥'])}</div>`);
        const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 80;
        p.style.left = r.left - sr.left + r.width / 2 - 17 + 'px'; p.style.top = r.top - sr.top + 70 + 'px';
        p.style.setProperty('--dx', Math.cos(a) * d + 'px'); p.style.setProperty('--dy', Math.sin(a) * d + 'px');
        sky.append(p); setTimeout(() => p.remove(), 800);
      }
      say(phon(b.j));
      if (!missed) { addStar(b.el); report('balloon'); } else oops();
      setTimeout(() => { if (sky.isConnected) round(); }, 1500);
    } else {
      SFX.no(); bounce(b.el, 'wob'); say(phon(b.j));
      missed = true; const x = info(target); thinkLock(sky, [phon(target), 350, x.w]);
    }
  }
  function tick(t) {
    if (!sky.isConnected) return;
    const dt = Math.min(.05, (t - (last || t)) / 1000); last = t;
    const H = sky.clientHeight, sp = speed();
    bl.forEach(b => {
      if (b.gone) return;
      b.y -= sp * dt;
      if (b.y < -240) b.y = H + 30 + Math.random() * 60;
      b.el.style.transform = `translate(${b.x}px,${b.y}px)`;
    });
    raf = requestAnimationFrame(tick);
  }
  cleanups.push(() => cancelAnimationFrame(raf));
  raf = requestAnimationFrame(() => { if (!sky.isConnected) return; round(); raf = requestAnimationFrame(tick); });
}

/* ───────── 🪙 우리가족 방 연결 (우리가족 앱과 같은 Firebase · 가족 문서) ─────────
   오늘의 한글을 다 끝낸 날: households/{코드}.kids.{아이}.room.items['hangul-날짜'] = 'coin'
   방 화면은 'coin' 칸을 모두 세므로 우리가족 앱은 고칠 것 없음. 날짜가 칸 이름이라 하루에 한 개만.
   ROOM_FIELD 는 our-family/stickers-shared.js 의 FS.ROOM 과 같아야 함 (방을 리셋하며 이름을 바꾸면 여기도). */
const ROOM_FIELD = 'room';
const FB = { A: null, F: null, auth: null, db: null, user: null, ready: false, err: '', loading: null };
S.coinQ = S.coinQ || [];
function startFirebase() {
  if (FB.loading) return FB.loading;
  if (!window.FIREBASE_CONFIG) return Promise.resolve();
  FB.loading = (async () => {
    try {
      const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const [{ initializeApp }, A, F] = await Promise.all([import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
      const app = initializeApp(window.FIREBASE_CONFIG);
      let db;
      try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
      catch (e) { db = F.getFirestore(app); }
      Object.assign(FB, { A, F, auth: A.getAuth(app), db });
      await new Promise(res => A.onAuthStateChanged(FB.auth, async user => {
        FB.user = user; FB.ready = true; FB.err = '';
        if (user && !S.house) {
          try { const u = await F.getDoc(F.doc(db, 'users', user.uid)); if (u.exists() && u.data().house) { S.house = u.data().house; save(); } }
          catch (e) { console.warn('house', e); }
        }
        flushCoins(); refreshLink(); res();
      }));
    } catch (e) { console.warn('firebase', e); FB.err = '연결하지 못했어요. 인터넷을 확인해 주세요.'; FB.loading = null; refreshLink(); }
  })();
  return FB.loading;
}
function flushCoins() {
  if (!FB.user || !S.house || !S.coinQ.length) return;
  const F = FB.F, ref = F.doc(FB.db, 'households', S.house);
  for (const c of S.coinQ.splice(0)) {
    const id = c.id || 'hangul-' + c.d, at = c.at || Date.now(), P = (...p) => new F.FieldPath('kids', c.k, ROOM_FIELD, ...p);
    // 특별 알: 방의 주간 미션 황금 알과 같은 모양 {egg:'gold'} (포켓몬 = 황금 알, 티니핑 = 황금 하트) / 코인: 칸 + 코인 기록
    const write = c.egg ? [P('mons', id), { egg: 'gold', f: 0, at }] : [P('items', id), 'coin', P('clog', 'h' + id), [at, 1, coinWhy(id)]];
    F.updateDoc(ref, ...write)
      .then(() => c.egg && eggToRoom(ref, c))
      .catch(e => { console.warn('coin', e); S.coinQ.push(c); save(); });
  }
  save();
}
// 코인 기록에 보일 이유: 오늘의 한글 · 도전 · 7일 연속 · 승급 시험 (our-family/poke-room.js 의 hangulWhy 와 같은 뜻)
function coinWhy(id) { const u = /^hangul-unit(\w+)-\d+$/.exec(id); return u ? `hangul:unit:${u[1]}` : /-chal$/.test(id) ? 'hangul:chal' : id.startsWith('hangul-streak-') ? 'hangul:streak' : 'hangul:day'; }
// 방에 나온 친구가 6마리보다 적으면 새 알도 방에 꺼내 두기 (아니면 친구 목록에서 기다림)
async function eggToRoom(ref, c) {
  try {
    const d = (await FB.F.getDoc(ref)).data() || {}, h = ((d.kids || {})[c.k] || {})[ROOM_FIELD]?.home;
    if (Array.isArray(h) && h.length < 6 && !h.includes(c.id)) await FB.F.updateDoc(ref, new FB.F.FieldPath('kids', c.k, ROOM_FIELD, 'home'), [...h, c.id]);
  } catch (e) { console.warn('egg home', e); }
}
// 보낼 줄에 넣고 보내기 (같은 아이·같은 칸은 한 번만. 인터넷이 없으면 기기에 모아 뒀다가 다음에 보냄)
function enqueue(items) {
  for (const it of items) if (!S.coinQ.some(c => c.k === kid && (it.id ? c.id === it.id : c.d === it.d && !c.id))) S.coinQ.push({ k: kid, at: Date.now(), ...it });
  save(); startFirebase().then(flushCoins);
}
// 도전·시험 보너스 코인 (연결 안 돼 있으면 0)
function queueCoins(ids) {
  if (!S.house || !ids.length) return 0;
  const d = dayState().date;
  enqueue(ids.map(id => ({ d, id })));
  return ids.length;
}
// 연결돼 있으면 오늘 코인 1개
function giveCoin() {
  if (!S.house) return false;
  enqueue([{ d: dayState().date }]);
  return true;
}
async function joinHouse(raw) {
  const code = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
  FB.err = '';
  try {
    if (!code || !(await FB.F.getDoc(FB.F.doc(FB.db, 'households', code))).exists()) { FB.err = '가족 코드를 찾지 못했어요'; return refreshLink(); }
    await FB.F.setDoc(FB.F.doc(FB.db, 'users', FB.user.uid), { house: code }, { merge: true });
    S.house = code; save(); flushCoins();
  } catch (e) { console.warn(e); FB.err = '가족 코드를 찾지 못했어요'; }
  refreshLink();
}
// 설정 창 안의 연결 칸 그리기
function refreshLink() {
  const box = $('#link'); if (!box) return;
  const err = FB.err ? `<div class="note" style="color:#d33">${FB.err}</div>` : '';
  if (!FB.auth) { box.innerHTML = err || '<div class="note">불러오는 중…</div>'; return; }
  if (!FB.user) {
    box.innerHTML = `${S.house ? '<div class="note">다시 로그인해 주세요.</div>' : ''}<button class="sbtn" id="gsign">구글로 로그인</button>${err}`;
    $('#gsign').onclick = () => FB.A.signInWithPopup(FB.auth, new FB.A.GoogleAuthProvider())
      .catch(e => { if (!/popup-closed|cancelled-popup/.test(String(e && e.code))) { FB.err = '로그인하지 못했어요'; refreshLink(); } });
    return;
  }
  if (!S.house) {
    box.innerHTML = `<div class="note">우리가족 앱 설정에 있는 가족 코드를 넣어 주세요.</div>
      <input id="hcode" placeholder="가족 코드" autocapitalize="characters" style="font-size:18px;padding:8px 12px;border-radius:12px;border:1px solid #ddd;width:12em"> <button class="sbtn" id="hjoin">연결</button>${err}`;
    $('#hjoin').onclick = () => joinHouse($('#hcode').value);
    return;
  }
  box.innerHTML = `<div>✅ 연결됨 · ${FB.user.displayName || '구글 계정'} · 가족 코드 ${S.house}</div>
    ${S.coinQ.length ? `<div class="note">보낼 코인 ${S.coinQ.length}개가 기다리는 중 (인터넷이 되면 들어가요)</div>` : ''}
    <button class="sbtn" id="gout" style="margin-top:6px">연결 끊기</button>${err}`;
  $('#gout').onclick = async () => { if (!confirm('연결을 끊을까요? 그 뒤로는 코인이 방에 들어가지 않아요.')) return; S.house = null; S.coinQ = []; save(); await FB.A.signOut(FB.auth); refreshLink(); };
}

/* ───────── 🐾 친구 이름: 포켓몬(다빈) · 티니핑(아린) 이름으로 글자 놀이 ─────────

function pickChar(limit) {

  if (all.length < 3) all = base;

/* ───────── 🃏 짝 맞추기: 카드를 뒤집어 같은 짝 찾기 ─────────
   아린: 글자 ↔ 그림 (ㄱ ↔ 🚂), 다빈: 낱말 ↔ 그림. 배운 것에서 나옴 */
function memory() {
  topbar('🃏 짝 맞추기', () => go(menu));
  const m = mainEl();
  const L = learned(), wins = K().mem || 0;
  let pairs;
  if (kid === 'arin') {
    const n = wins < 3 ? 3 : 4;
    let ls = [...new Set(L.letters.map(x => x.v))].filter(j => info(j));
    const recent = ls.length >= n ? ls.slice(-6) : [...new Set([...ls, ...ARIN_LETTERS.filter(info)])].slice(0, n);
    pairs = shuffle(recent).slice(0, n).map(j => { const x = info(j); return { key: j, a: { html: jamoHTML(j), say: [phon(j)] }, b: { html: x.e, say: [x.w] } }; });
  } else {
    const n = wins < 2 ? 4 : 6;
    const seen = new Set(), ws = [];
    for (const w of shuffle([...L.words.map(x => x.v).filter(w => w.n <= 3), ...knownWords().filter(w => w.n <= 3)])) { if (!seen.has(w.e)) { seen.add(w.e); ws.push(w); } if (ws.length >= n) break; }
    pairs = ws.map(w => ({ key: w.w, a: { html: w.w, say: null, cls: 'mw' }, b: { html: w.e, say: [w.w] } }));
  }
  const cards = shuffle(pairs.flatMap(p => [{ ...p.a, key: p.key }, { ...p.b, key: p.key }]));
  const cols = cards.length <= 6 ? 3 : 4;
  const grid = h(`<div class="memg" style="--cols:${cols}">${cards.map((c, i) => `<button class="mc" data-i="${i}"><span class="mf mback">${kid === 'arin' ? '💖' : '⭐'}</span><span class="mf mfront ${c.cls || ''}">${c.html}</span></button>`).join('')}</div>`);
  m.append(grid);
  const els = $$('.mc', grid);
  let open = [], busy = false, done = 0;
  els.forEach((el, i) => el.onclick = () => {
    if (busy || el.classList.contains('up')) return;
    el.classList.add('up'); SFX.tap();
    const c = cards[i]; if (c.say) say(...c.say);
    open.push(i);
    if (open.length < 2) return;
    const [a, b] = open; open = [];
    if (cards[a].key === cards[b].key) {
      setTimeout(() => {
        [a, b].forEach(k => els[k].classList.add('got')); SFX.ok();
        say(...(kid === 'arin' ? [phon(cards[a].key), 300, info(cards[a].key).w] : [cards[a].key]));
        if (++done === pairs.length) setTimeout(win, 1200);
      }, 500);
    } else {
      busy = true;
      setTimeout(() => { [a, b].forEach(k => els[k].classList.remove('up')); busy = false; }, 1200);
    }
  });
  function win() {
    K().mem = wins + 1; save();
    SFX.tada(); confetti(50); say('짝을 다 찾았어!'); addStar(grid);
    const nb = h('<button class="nextbtn">한 번 더 ▶</button>'); nb.onclick = () => go(memory); m.append(nb);
  }
}

  const [scene, text] = b.p[pi], words = text.split(' ');
  const pg = h(`<div class="page"><button class="scene">${scene}</button>
    <div class="sent">${words.map(w => `<button class="wd">${w}</button>`).join(' ')}</div>
    <div class="row"><button class="rb press prev">◀</button><button class="rb go press snd">🔊</button><button class="rb press next">${pi === b.p.length - 1 ? '끝 ✔' : '▶'}</button></div>
    <div class="dots">${b.p.map((_, i) => `<i class="${i === pi ? 'on' : ''}"></i>`).join('')}</div></div>`);
  m.append(pg);
  const wds = $$('.wd', pg);
  const clean = w => w.replace(/[.,!?]/g, '');
  wds.forEach(el => el.onclick = () => { wds.forEach(e => e.classList.remove('lit')); el.classList.add('lit'); bounce(el); say(clean(el.textContent)); });
  // 🔊 한 낱말씩 불 켜며 읽기
  async function readAll() {
    const tok = ++sayTok; if (synth) synth.cancel(); await sleep(60);
    for (const el of wds) { if (tok !== sayTok) return; wds.forEach(e => e.classList.remove('lit')); el.classList.add('lit'); await speak1(clean(el.textContent)); await sleep(120); }
    if (tok === sayTok) wds.forEach(e => e.classList.add('lit'));
  }
  $('.snd', pg).onclick = readAll;
  $('.scene', pg).onclick = () => { bounce($('.scene', pg)); readAll(); };
  $('.prev', pg).onclick = () => { if (pi > 0) go(readBook, b, pi - 1); };
  let fin = false;
  $('.next', pg).onclick = () => {
    if (pi < b.p.length - 1) return go(readBook, b, pi + 1);
    if (fin) return; fin = true;
    const first = !K().books[b.id]; K().books[b.id] = 1; save();
    SFX.tada(); confetti(50); say('끝!', 300, '참 잘 읽었어!');
    addStar($('.scene', pg)); if (first) setTimeout(() => addStar($('.scene', pg)), 400);
    setTimeout(() => { if (pg.isConnected) go(books); }, 2600);
  };
  if (kid === 'arin') setTimeout(readAll, 400);   // 아린이는 읽어 주기
}

/* ───────── 🔥 연속 출석: 오늘의 한글을 7일 연속 끝내면 큰 선물 ─────────
   7일마다: 🏆 트로피 + ⭐ 5 + (방이 연결돼 있으면) 🪙 5 보너스 */
function streakOf(k = kid) {
  const log = S.kids[k].log, d = new Date();
  if (!log[dayKey(d)]) d.setDate(d.getDate() - 1);     // 오늘 아직이면 어제까지 센 것
  let n = 0; while (log[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function streakEl() {
  const n = streakOf(), left = 7 - (n % 7);
  const t = (K().trophies || 0) % EGG_EVERY;
  return h(`<div class="streak">${n ? `🔥 <b>${n}일</b> 연속` : '🔥 오늘부터 시작!'} <small>· 🎁 큰 선물까지 ${left}일 · 🏆 ${t}/${EGG_EVERY} → ${specialEggName()}</small></div>`);
}
// 7일마다 🏆 + 🪙 5, 🏆 4개마다(= 7일 연속 4번) 🌟 특별 알 — 주간 미션 황금 스티커 4개와 같은 속도
const EGG_EVERY = 4;
const specialEggName = () => kid === 'arin' ? '👑 황금 하트' : '🌟 황금 알';
function giveStreakBonus() {
  const k = K(); k.trophies = (k.trophies || 0) + 1; save();
  const egg = k.trophies % EGG_EVERY === 0;
  if (!S.house) return { coins: false, egg: false };
  const d = dayState().date;
  enqueue([...Array.from({ length: 5 }, (_, i) => ({ d, id: `hangul-streak-${d}-${i}` })), ...(egg ? [{ d, id: `hangul-gold-${d}`, egg: 1 }] : [])]);
  return { coins: true, egg };
}

/* ───────── ⚙️ 부모 설정 ───────── */
function settings() {
  const vs = koVoices();
  const row = k => { const x = S.kids[k]; return `<tr><td>${KIDS[k].name}</td><td>⭐ ${x.stars}</td><td>들은 글자 ${Object.keys(x.heard).length}/24</td><td>쓴 글자 ${Object.keys(x.traced).length}/24 · 낱말 ${Object.keys(x.wtraced).length}</td><td>퍼즐 ${Object.keys(x.solved).length} · 읽기 ${Object.keys(x.read).length}</td></tr>`; };
  const ov = h(`<div class="ov"><div class="sheet">
    <h2>⚙️ 엄마 아빠 설정</h2>
    <h3>말 빠르기</h3>
    <div class="seg" id="rate">${[[.6, '아주 천천히'], [.7, '천천히'], [.8, '보통'], [.95, '빠르게']].map(([r, t]) => `<button data-r="${r}" class="${S.rate === r ? 'on' : ''}">${t}</button>`).join('')}</div>
    <h3>목소리</h3>
    ${vs.length ? `<select id="voice">${vs.map(v => `<option value="${v.name}" ${koVoice && v.name === koVoice.name ? 'selected' : ''}>${v.name}</option>`).join('')}</select>`
      : '<div class="note">한국어 목소리를 찾지 못했어요. 그래도 소리가 나는지 아래 단추로 확인해 보세요.</div>'}
    <button class="sbtn" id="test" style="margin-left:6px">🔊 들어 보기</button>
    <div class="note" style="margin-top:6px">소리가 안 나거나 어색하면: 아이패드 설정 → 손쉬운 사용 → 콘텐츠 말하기 → 음성 → 한국어 → '유나(향상됨)' 받기. 무음 모드면 효과음이 안 날 수 있어요.</div>
    <h3>지금까지</h3>
    <table>${row('davin')}${row('arin')}</table>
    <h3>🪙 포켓몬·티니핑 방 연결</h3>
    <div class="note">연결하면 오늘의 한글을 다 끝낸 날마다 다빈이는 포켓몬 방, 아린이는 티니핑 방에 코인 1개가 들어가요. 🎯 오늘의 도전을 통과한 날은 2개, 🎓 승급 시험 통과는 3개 더. 우리가족 앱과 같은 구글 계정과 가족 코드로 처음 한 번만 연결하면 돼요.</div>
    <div id="link" style="margin-top:6px"></div>
    <h3>📅 오늘의 한글 — 오늘 글자</h3>
    <div class="note">하루 미션을 다 끝내면 다음 날 새 글자로 넘어가요. 너무 쉽거나 어려우면 여기서 바꿔 주세요.</div>
    ${['davin', 'arin'].map(k => `<div style="margin:6px 0">${KIDS[k].name}: <button class="sbtn" data-ls="${k}" data-d="-1">◀</button> <b data-lt="${k}"></b> <button class="sbtn" data-ls="${k}" data-d="1">▶</button></div>`).join('')}
    <h3>🎓 승급 시험 · 🩹 헷갈리는 글자</h3>
    ${['davin', 'arin'].map(k => { const x = S.kids[k], w = weakList(x);
      return `<div style="margin:6px 0"><b>${KIDS[k].name}</b>: ${UNITS[k].map(([, n], u) => `<span class="medal ${x.units && x.units[u] ? 'on' : ''}">${x.units && x.units[u] ? '🎖️' : '⬜'} ${n}</span>`).join(' ')}
        <br><small>요즘 헷갈리는 글자: ${w.length ? w.map(([j, n]) => `<b>${j.startsWith('받침') ? '받침 ' + j.slice(2) : j}</b>(${Math.round(n)})`).join(' · ') : '아직 없어요 👍'}</small></div>`; }).join('')}
    <h3>이렇게 써 보세요</h3>
    <ul>
      <li><b>아린</b> (처음): 🔊 소리 카드로 ㄱ~ㅁ 다섯 글자만 듣고 → ✏️ 따라 쓰기 → 🎈 풍선 놀이(ㄱㄴㄷㄹㅁ 단계). 익숙해지면 다음 다섯 글자로. 모음은 ㅏㅓㅗㅜㅡㅣ 먼저.</li>
      <li><b>다빈</b> (받침 없는 글자 읽는 중): 🧱 글자 만들기(🎯 소리 듣고 만들기)로 '그+아=가' 합치는 연습 → 🧩 낱말 퍼즐(그림 보고 글자 맞추기) → 📖 읽고 찾기(소리 없이 읽고 그림 고르기, 막히면 글자를 눌러 한 글자씩 듣기).</li>
      <li>자음 소리는 '그, 느, 드…'(ㅡ를 붙인 소리)로, 모음은 '아, 야, 어…'로 들려줘요. 글자 이름(기역, 니은…)은 소리 카드의 이름 단추에 있어요.</li>
      <li>따라 쓰기: 초록 점에서 시작해 화살표 방향으로. 👀 은 쓰는 순서 보여 주기, 두 번 틀리면 저절로 보여 줘요. 아린이는 넉넉하게, 다빈이는 방향까지 봐요.</li>
      <li>📅 <b>오늘의 한글</b>: 매일 새로 배우기 + 🔁 지금까지 배운 것 섞어 복습. 다 하면 🏅 도장과 별 3개, 다음 날 새 과로 넘어가요.
        <br>아린 (36과): 글자 하나씩(ㄱ→ㄴ→ㅏ…) 배우다가 사이사이 '가 나'처럼 배운 글자를 합쳐 보는 날. 복습은 소리 듣고 글자 고르기, 그림 보고 첫 글자 고르기.
        <br>다빈 (28과): ㄱ~ㅎ 자음 줄(가거고구기) 14과 → 받침 ㄴ ㅇ ㅁ ㄹ → ㅐ ㅔ → 받침 ㄱ ㅂ ㅅ → ㅟ ㅢ → ㅘ ㅝ ㅚ → ㄲ → ㄸ ㅃ → ㅆ ㅉ. 복습은 소리 듣고 글자, 읽고 그림, 그림 보고 맞는 글씨 고르기(헷갈리는 글자로). 틀린 문제는 조금 뒤에 다시 나와요.
        <br>끝까지 다 배우면 매일 복습하는 날이 돼요.</li>
      <li>🐾 <b>친구 이름</b>: 다빈은 포켓몬, 아린은 티니핑 이름으로 글자 조각 맞추기(아린은 빈칸에 글자 모양이 흐리게 보여요), 다빈은 이름 읽고 친구 찾기도. 맞히면 📒 도감에 모여요. 다빈이 이름은 배운 만큼 쉬운 것부터(받침 없는 이름 → 쌍자음·겹모음 → 받침).</li>
      <li>🃏 <b>짝 맞추기</b>: 아린은 글자 ↔ 그림, 다빈은 낱말 ↔ 그림. 배운 것에서 나와요.</li>
      <li>📚 <b>그림책</b>: ⭐ 받침 없는 문장 4권, ⭐⭐ 받침 있는 문장 2권. 아린이는 페이지마다 읽어 줘요.</li>
      <li>🔥 <b>연속 출석</b>: 오늘의 한글을 7일 연속 끝내면 🏆 트로피 + ⭐ 5 + (방이 연결돼 있으면) 🪙 5개 더. 🏆 4개마다 방에 특별 알 (다빈 🌟 황금 알 = 전설의 포켓몬, 아린 👑 황금 하트 = 특별한 티니핑) — 주간 미션 황금 스티커 4개와 같은 속도.</li>
      <li>🎯 <b>오늘의 도전</b>: 하루 미션 마지막에 다빈 5문제(4개 맞히면 통과, 80%), 아린 4문제(3개). 처음 누른 답으로 채점하고 하루 한 번만 — 통과하면 그날 코인 2개, 못 넘어도 1개는 그대로.</li>
      <li>🎓 <b>승급 시험</b>: 단원(다빈 5단원, 아린 4단원) 마지막 과를 끝낸 다음 날. 10문제 중 다빈 8개, 아린 7개 맞히면 🎖️ 메달 + 코인 3개 + 다음 단원. 못 넘으면 다음 날 🩹 헷갈린 글자 복습, 그다음 날 다시 시험. 틀린 글자는 기록돼서 복습에 더 자주 나와요.</li>
      <li>🤔 <b>막 누르기 막기</b>: 틀리면 잠깐 생각 시간(눌러지지 않음)이 있고 문제를 다시 들려줘요. ⭐ 과 오늘의 미션 칸은 <b>한 번에 맞혔을 때만</b> 올라가요 (틀린 복습 문제는 나중에 다시 나와요). 글자 만들기는 두 번 틀리면 맞는 글자판이 반짝여요.</li>
      <li>별 10개마다 동물 스티커가 생겨요.</li>
    </ul>
    <h3>처음부터 다시</h3>
    <button class="sbtn" data-reset="davin">다빈 기록 지우기</button> <button class="sbtn" data-reset="arin">아린 기록 지우기</button>
    <div style="text-align:right;margin-top:16px"><button class="sbtn" id="close" style="background:var(--dav);font-size:20px">닫기</button></div>
  </div></div>`);
  $$('#rate button', ov).forEach(b => b.onclick = () => { S.rate = +b.dataset.r; save(); $$('#rate button', ov).forEach(o => o.classList.toggle('on', o === b)); say('가나다라마바사'); });
  const sel = $('#voice', ov); if (sel) sel.onchange = () => { S.voice = sel.value; save(); pickVoice(); say('안녕! 한글 놀이 하자!'); };
  $('#test', ov).onclick = () => say('안녕! 한글 놀이 하자!', 300, '그', 200, '아', 300, '가');
  $$('[data-reset]', ov).forEach(b => b.onclick = () => {
    const k = b.dataset.reset;
    if (confirm(`${KIDS[k].name} 별·스티커·기록을 모두 지울까요? 되돌릴 수 없어요.`)) { S.kids[k] = freshKid(); save(); ov.remove(); go(home); }
  });
  // 아이별 오늘 글자 (kid 를 잠깐 바꿔서 그 아이 기준으로 계산)
  const withKid = (k, f) => { const was = kid; kid = k; try { return f(); } finally { kid = was; } };
  const showLesson = () => $$('[data-lt]', ov).forEach(e => withKid(e.dataset.lt, () => { const d = dayState(); e.textContent = `${curLesson(d).title} (${d.lesson + 1}번째)`; }));
  $$('[data-ls]', ov).forEach(b => b.onclick = () => withKid(b.dataset.ls, () => {
    const d = dayState(); d.lesson = Math.max(0, d.lesson + +b.dataset.d); d.prog = {}; d.done = false;
    ['mode', 'unit', 'exam', 'examP'].forEach(x => delete d[x]); save(); showLesson();
  }));
  showLesson();
  $('#close', ov).onclick = () => { ov.remove(); go(home); };
  document.body.append(ov);
  refreshLink(); startFirebase();
}

go(home);

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
document.addEventListener('gesturestart', e => e.preventDefault());
// 밤새 켜 둔 앱을 다시 열면 (날이 바뀌었으면) 처음 화면부터
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.kids[kid].dm && S.kids[kid].dm.date !== dayKey()) { DM = null; go(home); }
});
